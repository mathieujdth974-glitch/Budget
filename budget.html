<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#20242d; --text:#f2f3f5; --muted:#8b93a1;
  --accent:#6c8cff; --green:#3ecf8e; --yellow:#e8b93c; --orange:#f0873a; --red:#f0554a;
  --border:#2a2e38;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --card:#ffffff; --card2:#f0f1f4; --text:#1a1d24; --muted:#6b7280;
    --border:#e3e5ea;
  }
}
:root[data-theme="dark"]{ --bg:#0f1115; }
html,body{height:100%; margin:0;}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px; margin:0 auto; padding:16px; padding-bottom:90px;}
.header{text-align:center; padding:20px 0 10px;}
.header .label{color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.05em;}
.header .amount{font-size:44px; font-weight:700; margin:6px 0;}
.header .sub{color:var(--muted); font-size:13px;}
.tabs{display:flex; gap:8px; margin:16px 0; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 14px; border-radius:20px; background:var(--card2); color:var(--muted); font-size:14px; white-space:nowrap; cursor:pointer; border:1px solid var(--border);}
.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
.wallet-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.wallet-name{font-weight:600; font-size:15px;}
.wallet-amounts{font-size:13px; color:var(--muted);}
.bar-bg{height:8px; border-radius:6px; background:var(--card2); overflow:hidden; margin-top:8px;}
.bar-fill{height:100%; border-radius:6px; transition:width .3s;}
.badge{font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px;}
.btn{background:var(--accent); color:#fff; border:none; border-radius:12px; padding:12px 16px; font-size:15px; font-weight:600; width:100%; cursor:pointer;}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}
.fab{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); max-width:448px; width:calc(100% - 32px); z-index:20;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:50;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg); width:100%; border-radius:20px 20px 0 0; padding:20px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); max-height:85vh; overflow-y:auto;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.field input, .field select{width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:15px;}
.row2{display:flex; gap:10px;}
.row2 > *{flex:1;}
.expense-item{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
.expense-item:last-child{border-bottom:none;}
.expense-meta{color:var(--muted); font-size:12px;}
.toast{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); padding:12px 18px; border-radius:12px; z-index:100; font-size:14px; box-shadow:0 4px 20px rgba(0,0,0,.3); opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; text-align:center;}
.toast.show{opacity:1;}
.empty{color:var(--muted); text-align:center; padding:20px; font-size:14px;}
.close-x{float:right; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;}
h3{margin:0 0 14px 0; font-size:17px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="label">Disponible ce mois-ci</div>
    <div class="amount" id="totalAmount">0 €</div>
    <div class="sub" id="totalSub">sur tous les portefeuilles</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="accueil">Accueil</div>
    <div class="tab" data-tab="jour">Jour</div>
    <div class="tab" data-tab="semaine">Semaine</div>
    <div class="tab" data-tab="mois">Mois</div>
  </div>

  <div id="content"></div>

  <div style="height:8px"></div>
  <button class="btn secondary" id="addWalletBtn">+ Nouveau portefeuille</button>
</div>

<button class="btn fab" id="addExpenseBtn">+ Ajouter une dépense</button>

<div class="toast" id="toast"></div>

<!-- Modal ajout dépense -->
<div class="modal-bg" id="expenseModalBg">
  <div class="modal">
    <span class="close-x" id="closeExpense">✕</span>
    <h3>Nouvelle dépense</h3>
    <div class="field"><label>Montant (€)</label><input type="number" step="0.01" id="expAmount" placeholder="12.50"></div>
    <div class="field"><label>Portefeuille</label><select id="expWallet"></select></div>
    <div class="field"><label>Lieu / note</label><input type="text" id="expPlace" placeholder="Restaurant, courses..."></div>
    <div class="field">
      <label>Moyen de paiement</label>
      <select id="expMethod"><option value="carte">Carte</option><option value="especes">Espèces</option></select>
    </div>
    <button class="btn" id="saveExpense">Enregistrer</button>
  </div>
</div>

<!-- Modal ajout portefeuille -->
<div class="modal-bg" id="walletModalBg">
  <div class="modal">
    <span class="close-x" id="closeWallet">✕</span>
    <h3>Nouveau portefeuille</h3>
    <div class="field"><label>Nom</label><input type="text" id="wName" placeholder="Vêtements"></div>
    <div class="row2">
      <div class="field"><label>Montant</label><input type="number" step="0.01" id="wAmount" placeholder="100"></div>
      <div class="field"><label>Période</label><select id="wPeriod"><option value="semaine">Semaine</option><option value="mois">Mois</option></select></div>
    </div>
    <button class="btn" id="saveWallet">Créer</button>
    <div style="height:8px"></div>
    <button class="btn secondary" id="deleteWallet" style="display:none; color:var(--red)">Supprimer ce portefeuille</button>
  </div>
</div>

<script>
const LS_KEY = 'budget_data_v1';
let data = load();

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    wallets: [
      {id:'eglise', name:'Église', amount:50, period:'mois'},
      {id:'sorties', name:'Sorties', amount:80, period:'mois'},
      {id:'economies', name:'Économies', amount:100, period:'mois'}
    ],
    expenses: [] // {id, walletId, amount, place, method, date}
  };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function isThisWeek(d){
  const now = new Date(); const day = new Date(d);
  const start = new Date(now); start.setDate(now.getDate() - ((now.getDay()+6)%7)); start.setHours(0,0,0,0);
  return day >= start;
}
function isThisMonth(d){
  const now = new Date(); const day = new Date(d);
  return day.getFullYear()===now.getFullYear() && day.getMonth()===now.getMonth();
}

function spentForWallet(walletId, period){
  return data.expenses.filter(e=>{
    if(e.walletId!==walletId) return false;
    if(period==='semaine') return isThisWeek(e.date);
    if(period==='mois') return isThisMonth(e.date);
    return true;
  }).reduce((s,e)=>s+e.amount,0);
}

function barColor(pct){
  if(pct>=100) return 'var(--red)';
  if(pct>=90) return 'var(--red)';
  if(pct>=70) return 'var(--orange)';
  if(pct>=50) return 'var(--yellow)';
  return 'var(--green)';
}

function renderTotal(){
  let total=0, totalSpent=0;
  data.wallets.forEach(w=>{
    total += w.amount;
    totalSpent += spentForWallet(w.id, w.period);
  });
  const remaining = total - totalSpent;
  document.getElementById('totalAmount').textContent = remaining.toFixed(2).replace('.00','') + ' €';
  document.getElementById('totalSub').textContent = `sur ${total.toFixed(0)} € répartis dans ${data.wallets.length} portefeuille(s)`;
}

function renderWalletSelect(){
  const sel = document.getElementById('expWallet');
  sel.innerHTML = data.wallets.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');
}

function renderAccueil(){
  let html = '';
  if(data.wallets.length===0) html += '<div class="empty">Aucun portefeuille pour l’instant.</div>';
  data.wallets.forEach(w=>{
    const spent = spentForWallet(w.id, w.period);
    const pct = w.amount>0 ? Math.min(100, (spent/w.amount)*100) : 0;
    const remaining = w.amount - spent;
    html += `<div class="card" style="cursor:pointer" onclick="openEditWallet('${w.id}')">
      <div class="wallet-row">
        <div class="wallet-name">${w.name} <span style="color:var(--muted); font-size:12px;">✎</span></div>
        <div class="wallet-amounts">${spent.toFixed(2)} / ${w.amount.toFixed(2)} €</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%; background:${barColor(pct)}"></div></div>
      <div style="margin-top:6px; font-size:12px; color:var(--muted)">
        ${remaining>=0 ? remaining.toFixed(2)+' € restants' : 'Dépassé de '+Math.abs(remaining).toFixed(2)+' €'} · par ${w.period}
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML = html;
}

function renderList(period, title){
  const filtered = data.expenses.filter(e=> period==='jour' ? e.date.slice(0,10)===todayStr() : period==='semaine' ? isThisWeek(e.date) : isThisMonth(e.date))
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  const total = filtered.reduce((s,e)=>s+e.amount,0);
  let html = `<div class="card"><h3>${title} — ${total.toFixed(2)} €</h3>`;
  if(filtered.length===0){
    html += '<div class="empty">Aucune dépense.</div>';
  } else {
    filtered.forEach(e=>{
      const w = data.wallets.find(x=>x.id===e.walletId);
      html += `<div class="expense-item">
        <div>
          <div>${e.place || '(sans note)'}</div>
          <div class="expense-meta">${w?w.name:'?'} · ${e.method==='carte'?'Carte':'Espèces'} · ${new Date(e.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div>${e.amount.toFixed(2)} €</div>
      </div>`;
    });
  }
  html += '</div>';
  // récap par portefeuille
  html += '<div class="card"><h3>Par portefeuille</h3>';
  data.wallets.forEach(w=>{
    const sp = filtered.filter(e=>e.walletId===w.id).reduce((s,e)=>s+e.amount,0);
    if(sp>0) html += `<div class="expense-item"><div>${w.name}</div><div>${sp.toFixed(2)} €</div></div>`;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function render(tab){
  renderTotal();
  renderWalletSelect();
  if(tab==='accueil') renderAccueil();
  else if(tab==='jour') renderList('jour', "Aujourd'hui");
  else if(tab==='semaine') renderList('semaine', 'Cette semaine');
  else if(tab==='mois') renderList('mois', 'Ce mois-ci');
}

let currentTab = 'accueil';
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    render(currentTab);
  });
});

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3500);
}

function checkThresholds(walletId, prevSpent, newSpent, amount){
  const w = data.wallets.find(x=>x.id===walletId);
  if(!w || w.amount<=0) return;
  const thresholds = [50,70,80,90,100];
  const prevPct = (prevSpent/w.amount)*100;
  const newPct = (newSpent/w.amount)*100;
  thresholds.forEach(t=>{
    if(prevPct < t && newPct >= t){
      showToast(`⚠️ ${w.name} : ${t}% du budget atteint`);
    }
  });
}

function addExpense(walletId, amount, place, method){
  const prevSpent = spentForWallet(walletId, data.wallets.find(w=>w.id===walletId).period);
  data.expenses.push({id:Date.now().toString(), walletId, amount, place, method, date:new Date().toISOString()});
  save();
  const newSpent = spentForWallet(walletId, data.wallets.find(w=>w.id===walletId).period);
  checkThresholds(walletId, prevSpent, newSpent, amount);
  render(currentTab);
}

// Modals
const expModalBg = document.getElementById('expenseModalBg');
document.getElementById('addExpenseBtn').onclick = ()=>{ expModalBg.classList.add('open'); };
document.getElementById('closeExpense').onclick = ()=>{ expModalBg.classList.remove('open'); };
document.getElementById('saveExpense').onclick = ()=>{
  const amount = parseFloat(document.getElementById('expAmount').value);
  const walletId = document.getElementById('expWallet').value;
  const place = document.getElementById('expPlace').value;
  const method = document.getElementById('expMethod').value;
  if(!amount || !walletId){ showToast('Montant et portefeuille requis'); return; }
  addExpense(walletId, amount, place, method);
  document.getElementById('expAmount').value='';
  document.getElementById('expPlace').value='';
  expModalBg.classList.remove('open');
  showToast(`✅ ${amount.toFixed(2)} € enregistrés`);
};

const wModalBg = document.getElementById('walletModalBg');
const wModalTitle = document.querySelector('#walletModalBg h3');
const deleteWalletBtn = document.getElementById('deleteWallet');
let editingWalletId = null;

function openNewWallet(){
  editingWalletId = null;
  wModalTitle.textContent = 'Nouveau portefeuille';
  document.getElementById('wName').value='';
  document.getElementById('wAmount').value='';
  document.getElementById('wPeriod').value='mois';
  deleteWalletBtn.style.display='none';
  document.getElementById('saveWallet').textContent='Créer';
  wModalBg.classList.add('open');
}

function openEditWallet(id){
  const w = data.wallets.find(x=>x.id===id);
  if(!w) return;
  editingWalletId = id;
  wModalTitle.textContent = 'Modifier le portefeuille';
  document.getElementById('wName').value = w.name;
  document.getElementById('wAmount').value = w.amount;
  document.getElementById('wPeriod').value = w.period;
  deleteWalletBtn.style.display='block';
  document.getElementById('saveWallet').textContent='Enregistrer';
  wModalBg.classList.add('open');
}
window.openEditWallet = openEditWallet;

document.getElementById('addWalletBtn').onclick = openNewWallet;
document.getElementById('closeWallet').onclick = ()=>{ wModalBg.classList.remove('open'); };
document.getElementById('saveWallet').onclick = ()=>{
  const name = document.getElementById('wName').value.trim();
  const amount = parseFloat(document.getElementById('wAmount').value);
  const period = document.getElementById('wPeriod').value;
  if(!name || !amount){ showToast('Nom et montant requis'); return; }
  if(editingWalletId){
    const w = data.wallets.find(x=>x.id===editingWalletId);
    w.name = name; w.amount = amount; w.period = period;
    showToast('✅ Portefeuille mis à jour');
  } else {
    data.wallets.push({id:'w'+Date.now(), name, amount, period});
    showToast('✅ Portefeuille créé');
  }
  save();
  wModalBg.classList.remove('open');
  render(currentTab);
};
deleteWalletBtn.onclick = ()=>{
  if(!editingWalletId) return;
  data.wallets = data.wallets.filter(x=>x.id!==editingWalletId);
  data.expenses = data.expenses.filter(e=>e.walletId!==editingWalletId);
  save();
  wModalBg.classList.remove('open');
  render(currentTab);
};

// --- Intégration Siri via paramètres d'URL ---
// Exemple de lien que le Raccourci Siri doit ouvrir :
// https://.../budget.html?montant=12&portefeuille=sorties&lieu=Restaurant&moyen=carte
(function handleSiriParams(){
  // DIAGNOSTIC TEMPORAIRE
  setTimeout(()=>{ showToast('🔍 URL reçue: ' + window.location.href.slice(0,150)); }, 800);

  // Essaie d'abord le hash (#montant=..&portefeuille=..), puis le query string (?montant=..) en secours
  let raw = window.location.hash ? window.location.hash.slice(1) : window.location.search.slice(1);
  const params = new URLSearchParams(raw);
  const montant = parseFloat(params.get('montant'));
  const portefeuille = params.get('portefeuille');
  if(montant && portefeuille){
    const w = data.wallets.find(x=>x.id===portefeuille || x.name.toLowerCase()===portefeuille.toLowerCase());
    if(w){
      const lieu = params.get('lieu') || '';
      const moyen = params.get('moyen')==='especes' ? 'especes' : 'carte';
      addExpense(w.id, montant, lieu, moyen);
      showToast(`🎙️ ${montant.toFixed(2)} € ajoutés à ${w.name}`);
    } else {
      showToast('Portefeuille introuvable : ' + portefeuille);
    }
    // nettoie l'URL pour éviter un double-ajout si on rafraîchit
    window.history.replaceState({}, '', window.location.pathname);
  }
})();

render(currentTab);
</script>
